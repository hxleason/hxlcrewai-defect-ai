# =============================================================================
# Alembic Configuration File (Production-Ready, ASCII only)
# =============================================================================

[alembic]

# ---------- Path to migration scripts ----------
script_location = alembic

# ---------- Template for migration file names ----------
# Example: 2025_01_15_1430-1a2b3c4d5e6f_add_user_table.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# ---------- Python path prepend ----------
prepend_sys_path = .

# ---------- Path separator (cross-platform) ----------
path_separator = os

# ---------- Database URL ----------
# This is overridden by env.py using settings.DATABASE_URL,
# so you can leave it unset or set a placeholder.
# sqlalchemy.url = sqlite+aiosqlite:///./placeholder.db

# ---------- Additional options (optional) ----------
# version_locations = %(here)s/alembic/versions
# recursive_version_locations = false
# timezone = UTC
# truncate_slug_length = 40
# output_encoding = utf-8


# =============================================================================
# Post-write hooks (optional)
# =============================================================================
[post_write_hooks]

# Format with black after generating migration
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME


# =============================================================================
# Logging configuration
# =============================================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S